<h1>의견보내기</h1>
<p>틀린 내용, 넣고 싶은 사건, 활용 사례를 알려 주세요.</p>
<form id="feedback">
  <label class="field"><span>분류</span>
    <select name="category" required>
      <option value="">분류를 선택해 주세요</option>
      <option value="bug">버그 및 오류 신고</option>
      <option value="feature">추가 요청</option>
      <option value="case">활용 사례</option>
      <option value="general">자유 의견</option>
    </select></label>
  <label class="field"><span>의견 내용</span>
    <textarea name="message" required maxlength="2000" placeholder="의견을 자유롭게 적어 주세요"></textarea></label>
  <div class="hp" aria-hidden="true"><label>비워 두세요 <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
  <button class="btn" type="submit">보내기</button>
  <p class="status" id="status" role="status"></p>
</form>
</article>

  <nav aria-label="사이트 안내"><a href="/">홈</a><a href="/wiki/">사용설명서</a><a href="/cases/">활용사례</a><a href="/history/">버전이력</a><a href="/privacy/">개인정보처리방침</a><a href="/helpdesk/" aria-current="page">의견보내기</a></nav>

<script>
(function () {
  var URL_ = 'https://koreahistory-app.vercel.app/api/feedback';
  var form = document.getElementById('feedback');
  var status = document.getElementById('status');
  var button = form.querySelector('button');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var category = form.category.value;
    var message = form.message.value;
    if (!category || !message.trim()) {
      status.className = 'status bad';
      status.textContent = '분류와 의견 내용을 모두 입력해 주세요.';
      return;
    }
    button.disabled = true;
    status.className = 'status';
    status.textContent = '보내는 중입니다.';
    try {
      var res = await fetch(URL_, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: category, message: message, website: form.website.value })
      });
      if (!res.ok) throw new Error('server');
      form.reset();
      status.className = 'status good';
      status.textContent = '의견을 보냈습니다. 고맙습니다.';
    } catch (err) {
      status.className = 'status bad';
      status.textContent = '보내지 못했습니다. 인터넷 연결을 확인하고 다시 보내 주세요.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
